name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
      CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Trim static export payloads
        # Keep robots/llms files and the 32-hex IndexNow key file at the root.
        run: find out -type f -name '*.txt' ! -name 'robots.txt' ! -name 'llms.txt' ! -name 'llms-full.txt' -regextype posix-extended ! -regex 'out/[0-9a-f]{32}\.txt' -delete

      - name: Snapshot live sitemap before deploy (IndexNow diff baseline)
        run: curl -fsS https://sbti.support/sitemap.xml -o "$RUNNER_TEMP/sitemap-before.xml" || true

      - run: npx wrangler@latest pages deploy out --project-name=sbti-support

      - name: Wait for the new deployment to serve the IndexNow key
        run: |
          KEY=$(node -e "import('./scripts/indexnow-push.mjs').then(m=>console.log(m.INDEXNOW_KEY))")
          for i in $(seq 1 30); do
            if [ "$(curl -fsS "https://sbti.support/$KEY.txt" 2>/dev/null)" = "$KEY" ]; then echo "key live"; exit 0; fi
            sleep 10
          done
          echo "key file not live after 5 minutes"; exit 1

      - name: IndexNow (Bing + api.indexnow.org)
        run: |
          if [ -s "$RUNNER_TEMP/sitemap-before.xml" ]; then
            node scripts/indexnow-push.mjs --baseline "$RUNNER_TEMP/sitemap-before.xml"
          else
            node scripts/indexnow-push.mjs --all
          fi
